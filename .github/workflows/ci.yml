name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pytest
      - name: Audit the example graders
        run: verifieraudit audit examples/tasks --out report
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ matrix.python-version }}
          path: report
